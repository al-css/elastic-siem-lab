# Logstash Pipeline Configuration
# File: /etc/logstash/conf.d/01-beats.conf
#
# Receives logs from Filebeat on port 5044,
# forwards structured events to Elasticsearch.

input {
  beats {
    port => 5044
  }
}

# Optional: add a filter block here later for grok parsing,
# field enrichment, or GeoIP lookups.
# filter {
#   grok { ... }
# }

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  # Uncomment below to also print events to console (debug only):
  # stdout { codec => rubydebug }
}
