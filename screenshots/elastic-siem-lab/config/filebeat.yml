# Filebeat Configuration
# File: /etc/filebeat/filebeat.yml
#
# Ships system logs (syslog, auth.log) to Logstash.

filebeat.inputs:
  - type: filestream
    enabled: false

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# -------------------------------------------------------
# Output: Logstash (comment out elasticsearch output)
# -------------------------------------------------------
output.logstash:
  hosts: ["localhost:5044"]

# Disabled — Logstash handles the ES output
# output.elasticsearch:
#   hosts: ["localhost:9200"]

# -------------------------------------------------------
# Kibana (for setup/dashboard loading only)
# -------------------------------------------------------
setup.kibana:
  host: "localhost:5601"

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640
