# Kibana Configuration (relevant settings only)
# Full file: /etc/kibana/kibana.yml

# Allow access from host machine's browser
server.host: "0.0.0.0"

# Point Kibana at the local Elasticsearch instance
elasticsearch.hosts: ["http://localhost:9200"]

# Optional: name shown in the Kibana UI
server.name: "siem-lab-kibana"
