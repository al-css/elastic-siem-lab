# Filebeat Configuration
# File: /etc/filebeat/filebeat.yml
#
# Ships system logs (syslog, auth.log) to Logstash.
#
# Filebeat cannot load its ingest pipelines or index template through
# Logstash. Run this once, pointing Filebeat straight at Elasticsearch
# (full command in docs/INSTALL.md, Step 5):
#   sudo filebeat setup --pipelines --modules system --index-management \
#     -E output.logstash.enabled=false -E 'output.elasticsearch.hosts=["localhost:9200"]' ...

filebeat.inputs:
  - type: filestream
    enabled: false

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# -------------------------------------------------------
# Output: Logstash (comment out elasticsearch output)
# -------------------------------------------------------
output.logstash:
  hosts: ["localhost:5044"]

# Disabled — Logstash handles the ES output
# output.elasticsearch:
#   hosts: ["localhost:9200"]

# -------------------------------------------------------
# Kibana (for setup/dashboard loading only)
# -------------------------------------------------------
setup.kibana:
  host: "localhost:5601"

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640
