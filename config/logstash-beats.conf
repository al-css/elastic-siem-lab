# Logstash pipeline configuration
# File: /etc/logstash/conf.d/01-beats.conf
#
# Receives events from Filebeat on port 5044 and sends them to
# Elasticsearch, running the Filebeat module ingest pipelines on the way.
# Those ingest pipelines are what turn a raw auth.log line into fields
# such as system.auth.ssh.event, source.ip and user.name. Without the
# "pipeline" option below, events arrive as one unparsed "message" field.
# (Load the pipelines first: docs/INSTALL.md, Step 5.)

input {
  beats {
    # Filebeat runs on this same VM. Change to "0.0.0.0" only when you add
    # agents on other machines, and allow 5044 from the lab subnet in UFW.
    host => "127.0.0.1"
    port => 5044
  }
}

output {
  if [@metadata][pipeline] {
    # Events from Filebeat modules (system/syslog, system/auth)
    elasticsearch {
      hosts           => ["http://localhost:9200"]
      manage_template => false
      index           => "%{[@metadata][beat]}-%{[@metadata][version]}"
      action          => "create"
      pipeline        => "%{[@metadata][pipeline]}"
      user            => "logstash_internal"
      password        => "${ES_PWD}"   # read from the Logstash keystore
    }
  } else {
    # Anything without a module pipeline
    elasticsearch {
      hosts           => ["http://localhost:9200"]
      manage_template => false
      index           => "%{[@metadata][beat]}-%{[@metadata][version]}"
      action          => "create"
      user            => "logstash_internal"
      password        => "${ES_PWD}"
    }
  }
  # Debug only: print events to the Logstash log
  # stdout { codec => rubydebug }
}
